{% extends "base.html" %}

{% block content %}
<div id="password-overlay">
  <div class="password-box">
    <h2>Course Access</h2>
    <p>Enter the password provided by your facilitator</p>
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <button onclick="checkPassword()">Enter</button>
    <p id="error-msg">Incorrect password</p>
  </div>
</div>

<div id="main-content">
  {{ super() }}
</div>

<script>
const PASSWORD_HASH = '6a27409fe1a89e91583ec6da7b091431d9d3fb070ad0c699dc152699f53f6c7d';

async function hashPassword(pwd) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pwd);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('password-input').value;
  const hash = await hashPassword(input);

  if (hash === PASSWORD_HASH) {
    localStorage.setItem('course-auth', 'true');
    showContent();
  } else {
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('password-input').value = '';
    document.getElementById('password-input').focus();
  }
}

function showContent() {
  document.getElementById('password-overlay').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
}

// Check if already authenticated
if (localStorage.getItem('course-auth') === 'true') {
  showContent();
}

// Enter key support
document.getElementById('password-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') checkPassword();
});
</script>

<style>
#password-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #546e7a;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#main-content {
  display: none;
}

.password-box {
  background: white;
  padding: 3rem;
  border-radius: 8px;
  text-align: center;
  max-width: 400px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.password-box h2 {
  margin-top: 0;
  color: #546e7a;
}

.password-box p {
  color: #666;
  margin-bottom: 1.5rem;
}

.password-box input {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 1rem;
  border: 2px solid #ddd;
  border-radius: 4px;
  font-size: 1rem;
  box-sizing: border-box;
}

.password-box input:focus {
  outline: none;
  border-color: #546e7a;
}

.password-box button {
  background: #546e7a;
  color: white;
  padding: 0.75rem 2rem;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1rem;
  transition: background 0.2s;
}

.password-box button:hover {
  background: #455a64;
}

#error-msg {
  color: #d32f2f;
  display: none;
  margin-top: 1rem;
  margin-bottom: 0;
}
</style>
{% endblock %}
