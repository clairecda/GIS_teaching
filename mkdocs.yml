site_name: Introduction to GIS
site_description: QGIS-first, Python-powered GIS course
site_author: Claire Boulange (and contributors)

docs_dir: site_docs

theme:
  name: material
  custom_dir: site_docs/overrides
  palette:
    - scheme: default
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - toc.follow
    - content.code.copy

nav:
  - Welcome:
      - Overview: index.md
      - How to use this course: guide/how-to-use.md
  - Slides: slides/index.md
  - Getting Ready:
      - 1. Install QGIS: onboarding/01-install-qgis.md
      - 2. Set up your workspace: onboarding/02-workspace-setup.md
      - 3. Download datasets: onboarding/03-download-data.md
      - 4. Python setup (Week 7+): onboarding/04-python-setup.md
  - Background Reading:
      - Overview: readings/index.md
      - 1. What is GIS?: readings/week01-what-is-gis.md
      - 2. Seeing Assumptions in GIS: readings/week01-critical-gis-lens.md
      - 3. Using AI as a Learning Partner: readings/using-ai-effectively.md
      - 4. Your Capstone Project: readings/week01-capstone-introduction.md
      - 5. Understanding CRS: readings/understanding-crs.md
      - 6. Administrative Boundaries: readings/week03-admin-boundaries.md
      - 7. Raster Data Basics: readings/week04-raster-basics.md
      - 8. Ethics in Spatial Analysis: readings/week05-ethics-in-mapping.md
      - 9. Python for GIS: readings/week07-python-for-gis.md
      - 10. Spatial Statistics & Regression: readings/spatial-statistics.md
  - Lectures & Theory:
      - Week 1 · Foundations of GIS: lectures/week01-fundamentals.md
      - Week 2 · Cartographic Conventions & Colour: lectures/week02-cartography.md
      - Week 3 · Boundary Systems & Data Joins: lectures/week03-boundaries.md
      - Week 4 · Elevation & Surface Modelling: lectures/week04-raster-theory.md
      - Week 5 · Ethics of Crime Mapping: lectures/week05-crime-ethics.md
      - Week 6 · Health Equity & Accessibility: lectures/week06-health-theory.md
      - Week 7 · Reproducibility & Environments: lectures/week07-reproducibility.md
      - Week 8 · Vector Automation Concepts: lectures/week08-vector-theory.md
      - Week 9 · Remote Sensing Change Detection: lectures/week09-remote-sensing.md
      - Week 10 · Network Theory for Mobility: lectures/week10-network-theory.md
      - Week 11 · Narrative Map Design: lectures/week11-storytelling.md
      - Week 12 · Capstone Synthesis & Reflection: lectures/week12-capstone-theory.md
  - Weekly Labs:
      - Week 1 · QGIS Orientation: weeks/week01.md
      - Week 2 · Symbology & Layouts: weeks/week02.md
      - Week 3 · Mapping Disadvantage: weeks/week03.md
      - Week 4 · Flood Risk Assessment: weeks/week04.md
      - Week 5 · Crime Hotspot Analysis: weeks/week05.md
      - Week 6 · Healthcare Accessibility: weeks/week06.md
      - Week 7 · Bridge to Python: weeks/week07.md
      - Week 8 · Python Vector Workflows: weeks/week08.md
      - Week 9 · Flood Risk (Python): weeks/week09.md
      - Week 10 · Transport Networks: weeks/week10.md
      - Week 11 · Design & Storytelling: weeks/week11.md
      - Week 12 · Capstone: weeks/week12.md
  - Reference:
      - Data:
          - Dataset inventory: reference/data-inventory.md
          - Data download checklist: reference/data-download-checklist.md
      - QGIS:
          - Quickstart cheat sheet: reference/qgis-quickstart.md
          - Toolbar reference: reference/toolbar.md
      - Python:
          - Notebooks (Weeks 7-10): reference/notebooks.md
      - Map Design:
          - Layout template: reference/layout-template.md
          - Color palettes: reference/color-palettes.md
          - Map titles guide: reference/map-titles.md
          - Design rubric: reference/design-rubric.md
          - Accessibility checklist: reference/accessibility-checklist.md
      - Capstone:
          - Project checklist: reference/project-checklist.md
          - Capstone examples: reference/capstone-examples.md
          - Report template: reference/capstone-template.md
          - Presentation template: reference/capstone-presentation-template.md
      - Other:
          - Reflection prompts: reference/reflections.md
  - Appendices:
      - Course roadmap: reference/roadmap.md
      - Continuing your GIS journey: reference/continuing-education.md
      - Licensing: reference/licensing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
      name: Source repository

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/external-links.js

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
  - codehilite
  - pymdownx.details
  - pymdownx.tasklist
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
